# Workflow name displayed in GitHub Actions
name: Backend CI

# Workflow triggers
on:
  push:
    paths:
      # Run when backend files change
      - "apps/backend/**"

      # Run when this workflow changes
      - ".github/workflows/backend-ci.yml"

  pull_request:
    paths:
      - "apps/backend/**"

permissions:
  id-token: write
  contents: read

jobs:
  backend-build:
    # Use GitHub hosted Ubuntu runner
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Python for Django checks
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Step 3: Install backend dependencies
      - name: Install backend dependencies
        run: |
          # Upgrade pip
          python -m pip install --upgrade pip

          # Install backend dependencies
          pip install -r apps/backend/requirements.txt

      # Step 4: Validate Django configuration
      - name: Run Django check
        working-directory: apps/backend
        env:
          # Temporary CI secret only
          DJANGO_SECRET_KEY: ci-test-secret

          # CI validation mode
          DJANGO_DEBUG: "True"

          # Database environment variables
          POSTGRES_DB: digi2
          POSTGRES_USER: digi2_user
          POSTGRES_PASSWORD: change-me
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432

          # Allowed hosts for CI
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          # Check Django project setup
          python manage.py check

      # Step 5: Configure AWS credentials for image publishing
      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::385018113052:role/Digi2GitHubActionsECRPushRole
          aws-region: us-east-1

      # Step 6: Login to Amazon ECR
      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Step 7: Verify backend ECR repository exists
      - name: Verify backend ECR repository exists
        if: github.event_name == 'push'
        env:
          AWS_REGION: us-east-1
          ECR_REPOSITORY: digi2-backend
        run: |
          if ! aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "::error::ECR repository '$ECR_REPOSITORY' does not exist or is not accessible in $AWS_REGION. Provision it with Terraform before pushing images."
            exit 1
          fi

           # Step 8: Build and push backend image
      - name: Build and push backend image
        if: github.event_name == 'push'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: digi2-backend
          SHA_TAG: ${{ github.sha }}
          VERSION_TAG: v1.${{ github.run_number }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            apps/backend

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SHA_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$VERSION_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
